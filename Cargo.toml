[package]
name = "missile-command"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A native Rust reconstruction of Atari's arcade Missile Command"
license = "MIT"
repository = "https://github.com/HungLo2020/MissileCommand"

[features]
default = ["desktop"]
desktop = [
    "dep:quasar-audio",
    "dep:quasar-input",
    "dep:quasar-render-2d",
    "dep:quasar-window",
    "quasar-render-2d/gpu",
    "quasar-render-2d/vulkan",
]

[dependencies]
quasar-core = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5" }
quasar-storage = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

quasar-audio = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5", optional = true }
quasar-input = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5", optional = true }
quasar-render-2d = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5", default-features = false, optional = true }
quasar-window = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5", optional = true }

[dev-dependencies]
tempfile = "3.27"

[profile.dev.package.shaderc-sys]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
