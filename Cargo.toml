[package]
name = "missile-command"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A native Rust reconstruction of Atari's arcade Missile Command"
license = "MIT"
repository = "https://github.com/HungLo2020/MissileCommand"

[dependencies]
minifb = { version = "0.28.0", default-features = false, features = ["x11"] }
serde_json = "1.0"
tempfile = "3.27"
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9.1"
x11rb = "0.13.2"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
