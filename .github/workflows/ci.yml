name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libx11-dev xvfb xauth xdotool x11-utils
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python -m unittest discover -s DevUtils -p 'test_*.py'
      - run: cargo build --locked --release
      - run: python3 DevUtils/window_smoke.py --binary target/release/missile-command
      - run: python DevUtils/package.py
      - name: Upload validated Linux package
        uses: actions/upload-artifact@v4
        with:
          name: missile-command-linux-x64
          path: dist/MissileCommand-*-linux-x64.zip
          if-no-files-found: error
